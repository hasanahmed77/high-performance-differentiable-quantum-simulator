name: Security

# CodeQL static analysis on every PR and push, and a weekly run of CodeQL and pip-audit, so new
# advisories surface without a code change (QS-110). pip-audit also gates every PR in ci.yml.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC, before Dependabot's 06:00 run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Python for the package and tests, actions for the workflows themselves.
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@52cf1852265d99e9bea071b03366fc777a602909 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@52cf1852265d99e9bea071b03366fc777a602909 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif
      - name: No high- or critical-severity findings
        run: python3 .github/scripts/check_sarif.py sarif

  audit:
    name: Dependency audit (pip-audit, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group lint
      - run: .github/scripts/audit-dependencies.sh
