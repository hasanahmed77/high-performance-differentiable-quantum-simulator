name: CI

on:
  pull_request:
    # labeled/unlabeled re-run the changelog check when `skip-changelog` is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"          # the lockfile is the source of truth; never re-resolve in CI
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (ruff, pre-commit hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --group lint
      - name: Verify lockfile is up to date
        run: uv lock --check
        env:
          UV_FROZEN: "0"
      - name: Run pre-commit hooks (mypy runs in its own job)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: mypy

  changelog:
    name: Changelog fragment
    # Docs-only or CI-only PRs opt out with the `skip-changelog` label.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --group lint
      - name: Require a news fragment in changes/
        run: uv run towncrier check --compare-with origin/${{ github.base_ref }}
      - name: Fragments render into the changelog
        run: uv run towncrier build --draft --version 0.0.0.dev0 > /dev/null

  types:
    name: Types (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # diff-cover compares against the base branch
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group test
      - name: Tests with project coverage gate (>= 85%)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Patch coverage gate (changed lines >= 90%)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90

  build:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Install the wheel into a clean environment and import it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          import importlib.resources, ketjet
          assert importlib.resources.files("ketjet").joinpath("py.typed").is_file()
          print("ketjet", ketjet.__version__, "imported from wheel")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  ci-success:
    name: CI success
    # Single required status check for branch protection; fails if any job failed or was cancelled.
    if: always()
    needs: [lint, changelog, types, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          # "skipped" is fine: the changelog job is skipped on pushes and on `skip-changelog` PRs.
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
