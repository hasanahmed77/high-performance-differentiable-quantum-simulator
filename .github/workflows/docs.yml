name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The nightly benchmarks update the asv dashboard (QS-1105); republish the site with it.
  workflow_run:
    workflows: [Nightly benchmarks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --group docs
      - name: Build site (warnings are errors)
        run: uv run mkdocs build --strict
      - name: Add the asv dashboard (QS-1105)
        run: |
          # The nightly benchmarks keep their dashboard on the asv-results branch; before the first
          # nightly run there's none, and the site goes out without it.
          if git fetch --depth=1 origin asv-results 2>/dev/null; then
            mkdir -p site/benchmarks/dashboard
            git archive FETCH_HEAD html | tar -x --strip-components=1 -C site/benchmarks/dashboard
          fi
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
