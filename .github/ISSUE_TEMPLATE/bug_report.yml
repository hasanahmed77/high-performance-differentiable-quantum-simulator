name: Bug report
description: Something produces a wrong result, crashes, or behaves unexpectedly
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security vulnerabilities, **don't** use this form. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducer
      description: The smallest script that shows the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ketjet version
      placeholder: python -c "import ketjet; print(ketjet.__version__)"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [NumPy, JAX (CPU), JAX (GPU), Native CPU, CUDA, Not sure]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, CPU/GPU model, and relevant package versions (numpy, jax, pennylane).
    validations:
      required: true
