site_name: ketjet
site_description: A high-performance differentiable quantum statevector simulator, usable as a PennyLane device.
site_url: https://hasanahmed77.github.io/high-performance-differentiable-quantum-simulator/
repo_url: https://github.com/hasanahmed77/high-performance-differentiable-quantum-simulator
repo_name: ketjet
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mustakim Ahmed Hasan. Licensed under Apache-2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Examples:
      - "Ground state of H₂ (VQE)": examples/vqe-h2.md
  - API reference: reference.md
  - Design decisions:
      - "ADR-0001: Statevector representation": adr/0001-statevector-representation.md
      - "ADR-0002: Circuit IR": adr/0002-circuit-ir.md
      - "ADR-0003: Measurements and observables": adr/0003-measurements-and-observables.md
      - "ADR-0004: Differentiation": adr/0004-differentiation.md
      - "ADR-0005: PennyLane device": adr/0005-pennylane-device.md
  - Sprint reports:
      - "Sprint 00: Foundations": sprints/sprint-00.md
      - "Sprint 01: The engine": sprints/sprint-01.md
      - "Sprint 02: Circuits and measurements": sprints/sprint-02.md
      - "Sprint 03: Differentiation": sprints/sprint-03.md
      - "Sprint 04: PennyLane device and v0.1.0": sprints/sprint-04.md
  - Development: development.md

exclude_docs: |
  /adr/0000-template.md
  /sprints/template.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
